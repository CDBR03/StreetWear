<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FC3B7F">
  <meta name="description" content="Lookbook STREETWEAR: estilo próprio, rua aberta e atitude sem filtro.">
  <title>Lookbook — STREETWEAR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">

  <script defer src="fallback.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="lookbook">
  <div class="curtain" aria-hidden="true"><span>STREET<b>WEAR</b></span></div>
  <div data-site-header></div>

  <main>
    <header class="lookbook-intro">
      <p class="eyebrow reveal">Streetwear® / Gente de verdade</p>
      <h1 class="display" data-split>Seu jeito.<br><em>Sua rua.</em></h1>
      <p class="lede reveal" style="--i: 3">Uma coleção ganha vida quando encontra quem veste com personalidade.</p>
    </header>

    <div class="marquee" style="--tilt: 0deg" aria-hidden="true">
      <div class="marquee-track"><span>Camadas de rua</span><i>✳</i><span>Volume com presença</span><i>✳</i><span>Sem rótulos</span><i>✳</i><span>Juntos, sem iguais</span><i>✳</i></div>
    </div>

    <section class="lookbook-grid">
      <figure class="lookbook-item lookbook-tall reveal">
        <img src="https://images.unsplash.com/photo-1677052088400-9d88145befc4?auto=format&fit=crop&w=1000&q=90" alt="Modelo em look urbano com jaqueta e calça cargo">
        <figcaption><span>01 / CAMADAS DE RUA</span><b>Move do seu jeito.</b></figcaption>
      </figure>
      <figure class="lookbook-item reveal" style="--i: 1">
        <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1000&q=90" alt="Modelo em ensaio de moda streetwear">
        <figcaption><span>02 / DROP 001</span><b>Volume com presença.</b></figcaption>
      </figure>
      <figure class="lookbook-item reveal" style="--i: 2">
        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1000&q=90" alt="Modelo em roupa contemporânea de rua" loading="lazy">
        <figcaption><span>03 / SEM RÓTULOS</span><b>Estilo é expressão.</b></figcaption>
      </figure>
      <figure class="lookbook-item lookbook-wide reveal">
        <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1400&q=90" alt="Amigas exploram looks de moda juntas" loading="lazy">
        <figcaption><span>04 / A RUA É COLETIVA</span><b>Juntos, sem iguais.</b></figcaption>
      </figure>
    </section>

    <section class="lookbook-cta">
      <p class="eyebrow reveal">Agora é sua vez</p>
      <h2 class="display" data-split>Vista sua<br><em>atitude.</em></h2>
      <div class="reveal"><a class="button button-blue" href="loja.html">Escolha seu look <span>↗</span></a></div>
    </section>
  </main>

  <div data-site-footer></div>
</body>
</html>
